name: AI Python syntax check

on:
  push:
    branches:
      - upgrade/kalasetu-ai-suite
  pull_request:
    branches:
      - main

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile AI Python modules
        run: python -m compileall -q ai
