<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KalaSetu | Verify Email</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f2eb;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 50px rgba(0,0,0,.1);
            text-align: center;
        }

        h1 {
            color: #7b4525;
        }

        p {
            color: #666;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 22px;
            letter-spacing: 8px;
            text-align: center;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b4f29;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
        }

        .secondary {
            background: transparent;
            color: #8b4f29;
        }

        .message {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .error {
            display: block;
            background: #ffe8e8;
            color: #a40000;
        }

        .success {
            display: block;
            background: #e7f8eb;
            color: #176b2b;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>KalaSetu</h1>

        <h2>Verify your email</h2>

        <p id="emailText">
            Enter the OTP sent to your email.
        </p>


        <form id="verifyForm">

            <input
                id="otp"
                type="text"
                inputmode="numeric"
                maxlength="6"
                pattern="[0-9]{6}"
                placeholder="000000"
                required
            >


            <div
                id="verifyMessage"
                class="message"
            ></div>


            <button type="submit">

                Verify Email

            </button>

        </form>


        <button
            id="resendButton"
            class="secondary"
            type="button"
        >

            Resend OTP

        </button>

    </div>

</div>


<script src="js/auth.js"></script>

</body>

</html>
